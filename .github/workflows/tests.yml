name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      VERSION: '4.0.0'
      SERVERPOD_PASSWORD_database: 'vb8ta-H3jLwjd27WTKZOzX7ymU9e8ahV'
      SERVERPOD_PASSWORD_redis: 'Hi_XAeJPe3ICcTbEDBX5OJn5YpqSOH5C'

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'

      - name: Start containers
        working-directory: open_basket_server
        run: docker compose up --quiet-pull --build -d

      - name: Install dependencies
        run: flutter pub get

      - name: Install Serverpod CLI
        run: |
          dart install serverpod_cli $VERSION
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      - name: Run Serverpod generator
        working-directory: open_basket_server
        run: serverpod generate

      - name: Run tests
        working-directory: open_basket_server
        run: dart test

      - name: Stop containers
        if: always()
        working-directory: open_basket_server
        run: docker compose down -v

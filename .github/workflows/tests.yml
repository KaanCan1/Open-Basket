name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      VERSION: '4.0.0'
      SERVERPOD_PASSWORD_database: 'vb8ta-H3jLwjd27WTKZOzX7ymU9e8ahV'
      SERVERPOD_PASSWORD_redis: 'Hi_XAeJPe3ICcTbEDBX5OJn5YpqSOH5C'
      # passwords.yaml is gitignored, so CI has no secrets file at all and
      # Serverpod reads them from SERVERPOD_PASSWORD_<key> instead. This one
      # peppers the sign-in code hashes (ADR-004); it is a throwaway value for
      # a throwaway database, not a secret that guards anything.
      SERVERPOD_PASSWORD_emailSecretHashPepper: 'ci-test-pepper-not-a-secret'
      SERVERPOD_PASSWORD_jwtRefreshTokenHashPepper: 'ci-test-jwt-pepper-not-a-secret'

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'

      - name: Start containers
        working-directory: open_basket_server
        run: docker compose up --quiet-pull --build -d

      - name: Install dependencies
        run: flutter pub get

      - name: Install Serverpod CLI
        run: |
          dart install serverpod_cli $VERSION
          echo "$HOME/.local/state/Dart/install/bin" >> $GITHUB_PATH

      - name: Run Serverpod generator
        working-directory: open_basket_server
        run: serverpod generate

      - name: Run tests
        working-directory: open_basket_server
        run: dart test

      - name: Stop containers
        if: always()
        working-directory: open_basket_server
        run: docker compose down -v

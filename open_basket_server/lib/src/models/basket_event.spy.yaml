### Pushed over the live basket stream. Not a table.
###
### The first event on every connection is a `snapshot` carrying the whole
### basket, so a client that reconnects can resync without a second call.
class: BasketEvent
fields:
  type: BasketEventType
  basket: Basket?
  ### Set on `snapshot`.
  items: List<BasketItem>?
  ### Set on the single-item events.
  item: BasketItem?
  ### Who has this basket on screen right now, by member id (ADR-049). Set on
  ### `snapshot`, and on the `basketUpdated` that announces a change in who
  ### is looking. Null on every other event, which means "unchanged".
  viewerMemberIds: List<int>?
  ### Sent on every event so the client can keep correcting for clock drift.
  serverTime: DateTime
